Listen 127.0.0.1:8087
<VirtualHost 127.0.0.1:8087>
    ServerName it.kskgroup.web.id
    DocumentRoot /apps/it-direktorat/current
    DirectoryIndex index.html

    Alias /status.json /apps/it-direktorat/status/status.json
    <Directory /apps/it-direktorat/status>
        Options -Indexes
        Require all granted
    </Directory>
    <Location /status.json>
        Header always set Cache-Control "no-store, max-age=0"
        Header always set Content-Type "application/json"
    </Location>

    <Directory /apps/it-direktorat>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <Location /_app/immutable/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    ErrorLog /var/log/httpd/it-direktorat-error.log
    CustomLog /var/log/httpd/it-direktorat-access.log combined
</VirtualHost>
