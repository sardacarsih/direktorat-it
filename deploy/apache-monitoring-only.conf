# Legacy website retired; retain host metrics for the Cloudflare Worker.
Listen 127.0.0.1:8087
<VirtualHost 127.0.0.1:8087>
    ServerName it.kskgroup.web.id
    ServerAlias it-origin.kskgroup.web.id
    DocumentRoot /apps/it-direktorat/status

    RedirectMatch 410 "^/(?!status[.]json$)"
    Alias /status.json /apps/it-direktorat/status/status.json

    <Directory /apps/it-direktorat>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /apps/it-direktorat/status>
        Options -Indexes
        Require all granted
    </Directory>
    <Location /status.json>
        Header always set Content-Type "application/json"
    </Location>

    Header always set Cache-Control "no-store, max-age=0"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog /var/log/httpd/it-direktorat-error.log
    CustomLog /var/log/httpd/it-direktorat-access.log combined
</VirtualHost>
